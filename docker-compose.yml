# Local stack. Copy .env.example to .env and set AUTH_SECRET and CRM_WEBHOOK_SECRET first.
x-app: &app
  build: .
  env_file:
    - {path: .env, required: false}
  environment: &app-environment
    DATABASE_URL: postgresql+psycopg2://ai_os:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/ai_os
    ASYNC_DATABASE_URL: postgresql+asyncpg://ai_os:${POSTGRES_PASSWORD}@postgres:5432/ai_os
    INVENTORY_READ_ONLY_DATABASE_URL: postgresql+asyncpg://inventory_reader:${INVENTORY_READER_PASSWORD:?set INVENTORY_READER_PASSWORD}@postgres:5432/ai_os
    QDRANT_URL: http://qdrant:6333
    TEMPORAL_ADDRESS: temporal:7233
  volumes:
    # Shares downloaded model weights. Uploaded files live in Postgres.
    - models:/home/app/.cache

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ai_os
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_os
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ai_os]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.13.6
    volumes: [qdrant:/qdrant/storage]

  temporal:
    image: temporalio/auto-setup:1.27.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ai_os
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres: {condition: service_healthy}

  migrate:
    <<: *app
    command: >-
      sh -c "alembic upgrade head &&
      python -c \"import os, sqlalchemy as s;
      e = s.create_engine(os.environ['DATABASE_URL']);
      c = e.connect();
      c.execute(s.text('DO \\$\\$ BEGIN CREATE ROLE inventory_reader LOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END \\$\\$'));
      c.execute(s.text('GRANT USAGE ON SCHEMA public TO inventory_reader'));
      c.execute(s.text('GRANT SELECT ON units TO inventory_reader'));
      c.execute(s.text(\\\"ALTER ROLE inventory_reader PASSWORD '\\\" + os.environ['INVENTORY_READER_PASSWORD'] + \\\"'\\\"));
      c.commit()\""
    environment:
      <<: *app-environment
      INVENTORY_READER_PASSWORD: ${INVENTORY_READER_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *app
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      qdrant: {condition: service_started}
      temporal: {condition: service_started}

  worker:
    <<: *app
    command: python -m ai_os.bootstrap.worker
    depends_on:
      migrate: {condition: service_completed_successfully}
      qdrant: {condition: service_started}
      temporal: {condition: service_started}

volumes:
  postgres:
  qdrant:
  models:
